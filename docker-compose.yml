x-backend-env: &backend-env
  NODE_ENV: development
  DATABASE_URL: mysql://root:root@mysql:3306/streambox
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000          # API and worker reach MinIO over the docker network
  S3_PUBLIC_ENDPOINT: http://localhost:9000 # the browser uploads/plays through this address
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: streambox
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-dev-only-secret-12345}

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: streambox
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  api:
    build: ./backend
    command: sh -c "npx prisma db push --skip-generate && node prisma/seed.js && npx nodemon --legacy-watch src/server.js"
    ports: ["3000:3000"]
    environment:
      <<: *backend-env
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/auth/google/callback}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  # Same image as the API, different entrypoint. Scale it with: docker compose up -d --scale worker=3
  worker:
    build: ./backend
    command: npx nodemon --legacy-watch src/worker/index.js
    environment:
      <<: *backend-env
      TRANSCODE_CONCURRENCY: 1
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }

  web:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  mysql_data:
  minio_data:

